name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Una serie de pushes seguidos sólo deja viva la última ejecución.
concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruebas:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # better-sqlite3 exige Node >=22; se prueban la LTS y la actual.
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar sintaxis del cliente
        # La interfaz no pasa por un compilador: este es su único control.
        run: |
          find public/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Pruebas automatizadas
        run: npm test

      - name: Arranque en frío sobre base vacía
        # Regresión conocida: leer configuración al importar un módulo rompía
        # el arranque cuando el esquema todavía no existía.
        env:
          PORT: '3210'
          CDH_DATA_DIR: ${{ runner.temp }}/cdh-arranque
        run: |
          set -euo pipefail
          npm start > "$RUNNER_TEMP/servidor.log" 2>&1 &
          PID=$!
          for _ in $(seq 1 30); do
            if curl -sf "http://localhost:$PORT/api/health" > /dev/null; then break; fi
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "::error::El servidor terminó durante el arranque."
              cat "$RUNNER_TEMP/servidor.log"; exit 1
            fi
            sleep 1
          done
          curl -sf "http://localhost:$PORT/api/health" > /dev/null \
            || { echo "::error::El servidor no respondió a /api/health."; cat "$RUNNER_TEMP/servidor.log"; exit 1; }

          HABITACIONES=$(node -e "
            const D = require('better-sqlite3');
            const db = new D(process.env.CDH_DATA_DIR + '/cdh.sqlite', { readonly: true });
            process.stdout.write(String(db.prepare('SELECT COUNT(*) n FROM rooms').get().n));
          ")
          echo "Habitaciones sembradas: $HABITACIONES"
          if [ "$HABITACIONES" != "155" ]; then
            echo "::error::Se esperaban 155 habitaciones y se sembraron $HABITACIONES."
            cat "$RUNNER_TEMP/servidor.log"; exit 1
          fi
          kill "$PID"
          echo "Arranque en frío correcto: 155 habitaciones en 9 pisos."

  interfaz:
    name: Interfaz (navegador)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Pruebas de interfaz
        # Levantan su propio servidor sobre una base temporal y lo apagan al
        # terminar: no hace falta orquestar nada desde el workflow.
        run: npm run test:ui

      - name: Guardar el resultado si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interfaz-fallo
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: Windows (Node 22)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        # better-sqlite3 trae binarios precompilados para win32-x64, pero npm
        # dispara node-gyp igualmente por la presencia de binding.gyp, y el
        # runner no tiene una versión de Visual Studio que node-gyp reconozca.
        # --ignore-scripts evita esa compilación innecesaria; ninguna
        # dependencia del proyecto declara scripts de instalación.
        run: npm ci --ignore-scripts

      - name: Pruebas automatizadas
        run: npm test

      - name: Los scripts de línea de comandos deben ejecutarse de verdad
        # En Windows las rutas llevan barras invertidas y letra de unidad. Un
        # guardián de "módulo principal" mal escrito hace que el script
        # termine en silencio, sin ejecutar nada y sin error, así que aquí se
        # exige salida real en lugar de conformarse con el código de salida.
        shell: pwsh
        env:
          CDH_DATA_DIR: ${{ runner.temp }}\cdh-win
          CDH_SEED_PASSWORD: Windows#Prueba2026
        run: |
          $seed = npm run seed --silent | Out-String
          Write-Host $seed
          if ($seed -notmatch '\[seed\]') { throw "seed.js no imprimió nada: no llegó a ejecutarse" }
          $up = npm run upgrade --silent | Out-String
          Write-Host $up
          if ($up -notmatch '\[upgrade\]') { throw "upgrade.js no imprimió nada: no llegó a ejecutarse" }

  actualizacion:
    name: Actualización desde la versión anterior
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Hace falta el historial para sembrar con la versión anterior.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Sembrar con la versión anterior y ponerla al día con esta
        # El hotel no reinstala: actualiza una base EN USO. Este paso es el
        # único que recorre ese camino de verdad. Ya atrapó un índice de
        # schema.sql sobre una columna que en una base vieja todavía no existe:
        # las pruebas, que siempre parten de una base nueva, no podían verlo.
        env:
          CDH_DATA_DIR: ${{ runner.temp }}/cdh-vieja
          CDH_SEED_PASSWORD: Actualiza#Prueba2026
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="$(git rev-parse HEAD~1 2>/dev/null || true)"; fi
          if [ -z "$BASE" ]; then echo "Sin versión anterior con la que comparar."; exit 0; fi
          echo "Versión anterior: $BASE"

          git worktree add --detach "$RUNNER_TEMP/anterior" "$BASE"
          ln -s "$PWD/node_modules" "$RUNNER_TEMP/anterior/node_modules"

          # 1) Base sembrada y operada por la versión anterior.
          ( cd "$RUNNER_TEMP/anterior"
            npm run seed --silent > /dev/null
            node --input-type=module -e "
              const { one } = await import('./server/lib/db.js');
              const { loadSettings } = await import('./server/lib/settings.js'); loadSettings();
              const { withPermissions, findUserByUsername } = await import('./server/lib/auth.js');
              const { recordMovement, getRoomByNumber } = await import('./server/lib/movements.js');
              const u = withPermissions(findUserByUsername('supervisor'));
              recordMovement({ roomId: getRoomByNumber('401').id, user: u, movementTypeCode: 'CLEAN_DONE' });
              recordMovement({ roomId: getRoomByNumber('402').id, user: u, movementTypeCode: 'MAINT_REPORT',
                comment: 'Fuga registrada antes de actualizar.' });
              process.stdout.write(String(one('SELECT COUNT(*) n FROM movements').n));
            " ) > "$RUNNER_TEMP/movimientos-antes.txt"
          export ANTES="$(cat "$RUNNER_TEMP/movimientos-antes.txt")"
          echo "Movimientos registrados con la versión anterior: $ANTES"

          # 2) La simulación anuncia el plan y no escribe nada.
          npm run upgrade --silent -- --dry-run
          node --input-type=module -e "
            const { one } = await import('./server/lib/db.js');
            const n = one('SELECT COUNT(*) x FROM room_occupancies').x;
            if (n) { console.error('::error::la simulación escribió en la base'); process.exit(1); }
          "

          # 3) La puesta al día de verdad; la segunda pasada no cambia nada.
          npm run upgrade --silent
          SEGUNDA="$(npm run upgrade --silent)"
          echo "$SEGUNDA"
          case "$SEGUNDA" in
            *"ya está al día"*) ;;
            *) echo "::error::la segunda pasada no es idempotente"; exit 1 ;;
          esac

          # 4) El historial no se tocó y la operación sigue funcionando.
          node --input-type=module -e "
            const { one } = await import('./server/lib/db.js');
            const { loadSettings } = await import('./server/lib/settings.js'); loadSettings();
            const { withPermissions, findUserByUsername } = await import('./server/lib/auth.js');
            const { recordMovement, getRoomByNumber } = await import('./server/lib/movements.js');
            const fallo = (m) => { console.error('::error::' + m); process.exit(1); };
            if (one('SELECT COUNT(*) n FROM movements').n !== Number(process.env.ANTES)) {
              fallo('el historial cambió durante la puesta al día');
            }
            if (one('SELECT COUNT(*) n FROM rooms WHERE occupancy_id IS NULL').n) {
              fallo('quedaron habitaciones sin ocupación');
            }
            const rec = withPermissions(findUserByUsername('recepcion'));
            const r = recordMovement({ roomId: getRoomByNumber('403').id, user: rec, movementTypeCode: 'CHECK_IN' });
            console.log('403 tras el check-in:', r.room.occupancy_name, '/', r.room.status_name);
            if (r.room.occupancy_code !== 'OCUPADA') fallo('la operación no funciona tras actualizar');
          "
          echo "Actualización correcta sobre una base en uso."

      - name: Limpiar la copia de la versión anterior
        if: always()
        run: git worktree remove "$RUNNER_TEMP/anterior" --force || true

  imagen:
    name: Imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Los dos composes deben resolverse
        env:
          CDH_SEED_PASSWORD: Imagen#Prueba2026
          CDH_DOMAIN: cdh.ejemplo.com
        run: |
          docker compose config > /dev/null
          docker compose -f docker-compose.yml -f docker-compose.caddy.yml config > /dev/null

      - name: Construir la imagen
        # Este paso es el que faltaba: el Dockerfile llegó a producción sin
        # haberse construido nunca, y npm compilaba better-sqlite3 en Alpine
        # por la presencia de binding.gyp, sin compilador en la imagen.
        run: docker build -t cdh-quartz:ci .

      - name: La imagen debe arrancar y sembrar el hotel
        run: |
          set -euo pipefail
          docker run -d --name cdh-ci -p 3300:3000 \
            -e CDH_SEED_PASSWORD='Imagen#Prueba2026' \
            -e CDH_TZ='America/Tijuana' \
            cdh-quartz:ci

          for _ in $(seq 1 40); do
            if curl -sf http://localhost:3300/api/health > /dev/null; then break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' cdh-ci)" != "true" ]; then
              echo "::error::El contenedor terminó durante el arranque."
              docker logs cdh-ci; exit 1
            fi
            sleep 1
          done
          curl -sf http://localhost:3300/api/health > /dev/null \
            || { echo "::error::La imagen no respondió a /api/health."; docker logs cdh-ci; exit 1; }

          # Si el binario nativo no cargara desde prebuilds/, esto lo delata.
          HABITACIONES=$(docker exec cdh-ci node -e "
            const D = require('better-sqlite3');
            const db = new D(process.env.CDH_DATA_DIR + '/cdh.sqlite', { readonly: true });
            process.stdout.write(String(db.prepare('SELECT COUNT(*) n FROM rooms').get().n));
          ")
          echo "Habitaciones sembradas en la imagen: $HABITACIONES"
          if [ "$HABITACIONES" != "155" ]; then
            echo "::error::Se esperaban 155 habitaciones y hay $HABITACIONES."
            docker logs cdh-ci; exit 1
          fi

          # El respaldo en caliente también vive dentro de la imagen.
          docker exec cdh-ci npm run backup --silent

          docker rm -f cdh-ci
          echo "Imagen correcta: arranca, siembra 155 habitaciones y respalda."
