name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Una serie de pushes seguidos sólo deja viva la última ejecución.
concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruebas:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # better-sqlite3 exige Node >=22; se prueban la LTS y la actual.
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar sintaxis del cliente
        # La interfaz no pasa por un compilador: este es su único control.
        run: |
          find public/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Pruebas automatizadas
        run: npm test

      - name: Arranque en frío sobre base vacía
        # Regresión conocida: leer configuración al importar un módulo rompía
        # el arranque cuando el esquema todavía no existía.
        env:
          PORT: '3210'
          CDH_DATA_DIR: ${{ runner.temp }}/cdh-arranque
        run: |
          set -euo pipefail
          npm start > "$RUNNER_TEMP/servidor.log" 2>&1 &
          PID=$!
          for _ in $(seq 1 30); do
            if curl -sf "http://localhost:$PORT/api/health" > /dev/null; then break; fi
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "::error::El servidor terminó durante el arranque."
              cat "$RUNNER_TEMP/servidor.log"; exit 1
            fi
            sleep 1
          done
          curl -sf "http://localhost:$PORT/api/health" > /dev/null \
            || { echo "::error::El servidor no respondió a /api/health."; cat "$RUNNER_TEMP/servidor.log"; exit 1; }

          HABITACIONES=$(node -e "
            const D = require('better-sqlite3');
            const db = new D(process.env.CDH_DATA_DIR + '/cdh.sqlite', { readonly: true });
            process.stdout.write(String(db.prepare('SELECT COUNT(*) n FROM rooms').get().n));
          ")
          echo "Habitaciones sembradas: $HABITACIONES"
          if [ "$HABITACIONES" != "155" ]; then
            echo "::error::Se esperaban 155 habitaciones y se sembraron $HABITACIONES."
            cat "$RUNNER_TEMP/servidor.log"; exit 1
          fi
          kill "$PID"
          echo "Arranque en frío correcto: 155 habitaciones en 9 pisos."

  interfaz:
    name: Interfaz (navegador)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Pruebas de interfaz
        # Levantan su propio servidor sobre una base temporal y lo apagan al
        # terminar: no hace falta orquestar nada desde el workflow.
        run: npm run test:ui

      - name: Guardar el resultado si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interfaz-fallo
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: Windows (Node 22)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        # better-sqlite3 trae binarios precompilados para win32-x64, pero npm
        # dispara node-gyp igualmente por la presencia de binding.gyp, y el
        # runner no tiene una versión de Visual Studio que node-gyp reconozca.
        # --ignore-scripts evita esa compilación innecesaria; ninguna
        # dependencia del proyecto declara scripts de instalación.
        run: npm ci --ignore-scripts

      - name: Pruebas automatizadas
        run: npm test

      - name: Los scripts de línea de comandos deben ejecutarse de verdad
        # En Windows las rutas llevan barras invertidas y letra de unidad. Un
        # guardián de "módulo principal" mal escrito hace que el script
        # termine en silencio, sin ejecutar nada y sin error, así que aquí se
        # exige salida real en lugar de conformarse con el código de salida.
        shell: pwsh
        env:
          CDH_DATA_DIR: ${{ runner.temp }}\cdh-win
          CDH_SEED_PASSWORD: Windows#Prueba2026
        run: |
          $seed = npm run seed --silent | Out-String
          Write-Host $seed
          if ($seed -notmatch '\[seed\]') { throw "seed.js no imprimió nada: no llegó a ejecutarse" }
          $up = npm run upgrade --silent | Out-String
          Write-Host $up
          if ($up -notmatch '\[upgrade\]') { throw "upgrade.js no imprimió nada: no llegó a ejecutarse" }
